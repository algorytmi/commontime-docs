# Finnish build. See mkdocs.en.yml for the English one — two configs rather
# than one, because mkdocs-shadcn has no content i18n and its own i18n is
# gettext for the theme's UI strings only.
site_name: Common Time
site_description: >-
  Common Time on verkkoprotokolla, joka synkronoi valmiiksi ladatun audion
  toiston eri laitteilla. Verkossa ei siirretä ääntä, vaan ankkuriaika ja
  kelloaskeleet.
site_url: https://common-time.dev/fi/
site_author: Common Time (Juho Hietala)
# Renders as the GitHub mark in the top bar. show_stargazers stays off:
# it would make every visitor's browser call the GitHub API, and this
# site otherwise makes no third-party request at all.
repo_url: https://github.com/algorytmi/commontime-docs
repo_name: algorytmi/commontime-docs
copyright: commontime/1 · 1.7

docs_dir: docs/fi
site_dir: site/fi

theme:
  name: shadcn
  custom_dir: overrides
  # Drives the theme's gettext catalogue (see locales/).
  locale: fi
  show_title: true
  show_stargazers: false
  hide_source_files: true
  show_datetime: false
  topbar_sections: false
  # Inlined by the theme (read_file | safe), not linked — currentColor
  # therefore follows the top bar into dark mode. The culled six-ring
  # variant at 32 px: the full mark was measured muddy at 32 and
  # unreadable at 16, and the 32-47 px band is what the variant is for.
  icon: assets/img/ctp-symbol-small.svg
  # Below the measured floor. A favicon is drawn at 16 px, where the
  # mark's documentation calls for a separately drawn version that does
  # not exist yet — it awaits the author's decision. The culled variant
  # is the least bad thing available, not a compliant one.
  favicon: assets/img/ctp-favicon.svg
  # Close to the accent the previous site used (#15618f).
  accent: "oklch(48% 0.105 245)"
  pygments_style:
    light: shadcn-light
    dark: github-dark

extra:
  lang_switch_href: https://common-time.dev/en/
  lang_switch_label: "In English"

extra_css:
  - assets/css/readout.css
  - assets/css/lang.css
  - assets/css/mark.css
  - assets/css/layout.css

extra_javascript:
  - assets/js/readout.js
  - assets/js/langswitch.js
  - assets/js/mark.js

plugins:
  # Resolves to the theme's own search plugin, which subclasses the
  # MkDocs one and carries the theme's mixins — declaring it here does
  # not lose them. lang drives the lunr stemmer for the index.
  - search:
      lang: fi

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Common Time: index.md
  - Määrittely:
      - "§1 · Verkkoliikenne": spec/crossing.md
      - "§2 · Aika ja kelloaskeleet": spec/time.md
      - "§4 · Sanomat": spec/messages.md
      - "§6 · Vaatimukset": spec/obligations.md
  - Esimerkit: examples.md
  - Tila: status.md
  - Pyyntö: contribute.md
  - Dokumentit: documents.md
  - Tietoja sivustosta: colophon.md
