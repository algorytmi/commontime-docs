{# Overrides the theme's own extension point (see shadcn/templates/extra_head.html).
   Kept to this one hook on purpose: copying header.html to add a link would
   pin us to that template's markup, and the theme is at 0.12 and moving. #}
<script>
  /* The two languages are two separate mkdocs builds — the theme has no
     content i18n — so the link between them is configuration, not nav.
     A top-level nav entry pointing at an external URL renders as a section
     heading with no anchor, which is why this is here instead. */
  window.CT_LANG_SWITCH = {
    href: {{ (config.extra.lang_switch_href or "/") | tojson }},
    label: {{ (config.extra.lang_switch_label or "") | tojson }}
  };
</script>
