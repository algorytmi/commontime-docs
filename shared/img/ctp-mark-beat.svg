<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" fill-rule="evenodd" role="img" aria-label="Common Time Protocol">
<title>Common Time Protocol</title>
<style>
/* Loaded through &lt;img&gt;, so currentColor does not reach here and the two
   themes are named explicitly. */
path { fill: #0e1116; }
@media (prefers-color-scheme: dark) { path { fill: #e9ecf0; } }

/*
  COMMON TIME — 4 beats per bar, 120 BPM, 1 beat = 500 ms, 1 bar = 2000 ms.
  Deliberately subtle: the mark does not bounce, it receives four impulses.
  Beat 4 opens slightly wider than 1-3 so the return to the downbeat reads.
*/
#logo {
  transform-box: fill-box;
  transform-origin: center;
  animation: commonTime 2s cubic-bezier(.22,.61,.36,1) infinite;
}

@keyframes commonTime {
  0%   { transform: translateY(0) scale(1); }
  7%   { transform: translateY(1px) scale(.994); }
  13%  { transform: translateY(0) scale(1); }
  25%  { transform: translateY(0) scale(1); }
  31%  { transform: translateY(.65px) scale(.997); }
  37%  { transform: translateY(0) scale(1); }
  50%  { transform: translateY(0) scale(1); }
  56%  { transform: translateY(.65px) scale(.997); }
  62%  { transform: translateY(0) scale(1); }
  75%  { transform: translateY(0) scale(1); }
  82%  { transform: translateY(-1px) scale(1.008); }
  90%  { transform: translateY(0) scale(1.002); }
  100% { transform: translateY(0) scale(1); }
}

/* The readout already stops for this; the mark does too. */
@media (prefers-reduced-motion: reduce) {
  #logo { animation: none; }
}
</style>
